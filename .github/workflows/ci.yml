name: CI
on: [push, pull_request]
jobs:
  tests:
    name: "Blood Donation Tracker"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
      
      - name: "Validate contract structure"
        run: |
          echo "=== Contract Structure Validation ==="
          if [ -f "contracts/blood-donation-tracker.clar" ]; then
            echo "✅ Contract file exists"
            lines=$(wc -l < contracts/blood-donation-tracker.clar)
            echo "✅ Contract has $lines lines"
          else
            echo "❌ Contract file missing"
            exit 1
          fi
          
          # Check for essential functions
          if grep -q "define-public.*register-donor" contracts/blood-donation-tracker.clar; then
            echo "✅ register-donor function found"
          else
            echo "❌ register-donor function missing"
            exit 1
          fi
          
          if grep -q "define-public.*record-donation" contracts/blood-donation-tracker.clar; then
            echo "✅ record-donation function found"
          else
            echo "❌ record-donation function missing"
            exit 1
          fi
          
          # Check for data structures
          if grep -q "define-map.*donors" contracts/blood-donation-tracker.clar; then
            echo "✅ donors map found"
          else
            echo "❌ donors map missing"
            exit 1
          fi
          
          echo "=== All validations passed ==="
          
      - name: "Check project files"
        run: |
          echo "=== Project Structure Check ==="
          [ -f "Clarinet.toml" ] && echo "✅ Clarinet.toml exists" || echo "❌ Clarinet.toml missing"
          [ -f "package.json" ] && echo "✅ package.json exists" || echo "❌ package.json missing"
          [ -f "PR-DETAILS.md" ] && echo "✅ Documentation exists" || echo "❌ Documentation missing"
          echo "=== Project validation complete ==="
